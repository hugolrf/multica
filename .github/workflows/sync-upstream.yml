name: Sync upstream

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork-main
        uses: actions/checkout@v4
        with:
          ref: fork-main
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.FORK_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync, verify and release
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "multica-fork-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/multica-ai/multica.git
          git fetch upstream main
          git fetch --tags --force origin

          if [ "$(git merge-base fork-main upstream/main)" = "$(git rev-parse upstream/main)" ]; then
            echo "Upstream sem novidades; nada a sincronizar."
            exit 0
          fi

          today="$(date -u +%F)"

          if ! git rebase upstream/main; then
            conflicts="$(git diff --name-only --diff-filter=U || true)"
            git rebase --abort || true
            printf 'SYNC_FAIL_REASON=Conflito no rebase de fork-main sobre upstream/main (%s). Arquivos: %s\n' "$today" "$(echo "$conflicts" | tr '\n' ' ')" >> "$GITHUB_ENV"
            echo "Conflito no rebase em: $conflicts" >&2
            exit 1
          fi

          ELECTRON_SKIP_BINARY_DOWNLOAD=1 pnpm install --frozen-lockfile

          if ! pnpm --dir apps/desktop typecheck; then
            printf 'SYNC_FAIL_REASON=Rebase limpo (%s), mas o typecheck do desktop quebrou.\n' "$today" >> "$GITHUB_ENV"
            echo "Typecheck falhou apos rebase limpo." >&2
            exit 1
          fi

          git push --force-with-lease origin fork-main

          patch="$(date -u +%-d%H%M)"
          version="2026.$(date -u +%-m).${patch}"
          while git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; do
            patch="$((patch + 1))"
            version="2026.$(date -u +%-m).${patch}"
          done
          tag="v${version}"

          git tag "$tag"
          git push origin "refs/tags/${tag}"

          gh workflow run release-fork-desktop.yml --ref "$tag" -R "$GITHUB_REPOSITORY"

          echo "Sync limpo: fork-main atualizada, tag ${tag} publicada e build disparado."

      - name: Alarme ntfy
        if: failure()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail

          if [ -z "${NTFY_URL:-}" ]; then
            echo "Alarme ntfy nao configurado (secret NTFY_URL ausente)."
            exit 0
          fi

          export ALARM_TOPIC="${NTFY_TOPIC:-multica-fork-sync}"
          export ALARM_REASON="${SYNC_FAIL_REASON:-Sync do fork com o upstream falhou.}"
          payload="$(node -e 'process.stdout.write(JSON.stringify({topic:process.env.ALARM_TOPIC,title:"Multica fork: sync com upstream falhou",message:process.env.ALARM_REASON+"\n"+process.env.RUN_URL,priority:4,tags:["rotating_light"]}))')"

          code="$(printf '%s' "$payload" | curl -sS -o /dev/null -w '%{http_code}' -X POST "$NTFY_URL" \
            -H "Content-Type: application/json" \
            ${NTFY_TOKEN:+-H "Authorization: Bearer $NTFY_TOKEN"} \
            --data-binary @- || echo 000)"

          echo "ntfy respondeu $code"
